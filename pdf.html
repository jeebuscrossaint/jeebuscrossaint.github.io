<script src="nav.js"></script>
<style>
  @view-transition { navigation: auto; }
  /* Inter stands in for SF on non-Apple platforms. Apple devices resolve -apple-system first and
     never download this file — browsers only fetch a webfont whose glyphs actually get used. */
  @font-face {
    font-family:'InterVar';
    src:url('fonts/inter-var-latin.woff2') format('woff2-variations');
    font-weight:100 900; font-style:normal; font-display:swap;
  }

  /* Apple's system palette — one considered scheme that follows the OS appearance
     instead of a random pick. These are Apple's published system colours:
     systemGroupedBackground / secondarySystemBackground, label / secondaryLabel,
     separator, and systemBlue in its light and dark variants. */
  :root {
    color-scheme: light dark;
    --bg:#F2F2F7; --bg-2:#FFFFFF; --surface:#FFFFFF;
    --ink:#000000; --ink-soft:#6C6C70;
    --rule:rgba(60,60,67,0.29); --rule-2:rgba(60,60,67,0.12);
    /* HIG: don't hard-code system colours — AccentColor resolves to the visitor's own OS
       accent (Graphite, Blue, whatever they set). Graphite is the fallback where the
       keyword is unsupported. Used for fills and tints only, never to carry meaning. */
    --accent:#8C8C8C;
    --accent:AccentColor;
    --edge:rgba(255,255,255,0.72); --mat:86%;
    --shadow:0 30px 60px -26px rgba(0,0,0,.26), 0 2px 8px rgba(0,0,0,.09);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      /* macOS dark, not iOS: windowBackgroundColor is a dark grey, not #000. Pure black is an
         OLED-phone value and reads as a hole on a desktop display. */
      --bg:#1C1C1E; --bg-2:#2C2C2E; --surface:#2C2C2E;
      --ink:#FFFFFF; --ink-soft:#A1A1A8;
      --rule:rgba(84,84,88,0.65); --rule-2:rgba(84,84,88,0.32);
      --accent:#98989F;
      --accent:AccentColor;
      --edge:rgba(255,255,255,0.16); --mat:70%;
      --shadow:0 34px 70px -24px rgba(0,0,0,.62), 0 3px 10px rgba(0,0,0,.22);
    }
  }
  @media (prefers-contrast: more) {
    :root {
      --ink-soft:#3C3C43;
      --rule:rgba(60,60,67,0.68); --rule-2:rgba(60,60,67,0.34);
      --mat:100%;
    }
  }
  @media (prefers-contrast: more) and (prefers-color-scheme: dark) {
    :root {
      --ink-soft:#EBEBF5;
      --rule:rgba(235,235,245,0.60); --rule-2:rgba(235,235,245,0.30);
      --mat:100%;
    }
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SFProText Nerd Font","SF Pro",InterVar,"Helvetica Neue",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; transition:background-color .35s ease, color .35s ease; }
  .mono { font-family:ui-monospace,"SF Mono","SFMono Nerd Font Mono",Menlo,Consolas,monospace; }
  a { color:inherit; text-decoration:none; }
  ::selection { background:color-mix(in srgb, var(--ink) 22%, transparent); color:var(--ink); }
  :focus-visible { outline:2px solid var(--ink); outline-offset:3px; }

  /* 3-col grid keeps the tabs optically centred regardless of the side content */
  .topbar { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; min-height:54px; padding:8px clamp(16px,4vw,36px); border-bottom:1px solid var(--rule-2); background:color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%); }
  .topbar .back { justify-self:start; }
  .topbar .tabs { justify-self:center; }
  .topbar .controls { justify-self:end; }
  .back { font-size:.9rem; letter-spacing:-0.006em; color:var(--ink-soft); font-weight:400; transition:color .18s; }
  .back:hover { color:var(--ink); } .back b { color:var(--ink); }
  .tabs { display:flex; gap:2px; border:1px solid var(--rule); border-radius:980px; padding:2px; background:color-mix(in srgb, var(--ink) 5%, transparent); }
  .tab { font-size:.82rem; letter-spacing:-0.004em; font-weight:500; color:var(--ink-soft); background:none; border:none; border-radius:980px; min-height:1.875rem; padding:.375rem .9rem; cursor:pointer;
    transition:color .18s, background .18s, transform .12s cubic-bezier(.2,.7,.2,1); }
  .tab:active { transform:scale(.97); transition-duration:.09s; }
  .tab:hover { color:var(--ink); }
  .tab.active { color:var(--ink); background:var(--surface); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.18), 0 0 0 .5px rgba(0,0,0,.06); }
  .controls { display:flex; align-items:center; gap:8px; }
  .btn { font-size:.8rem; letter-spacing:-0.004em; font-weight:500; color:var(--ink-soft); background:color-mix(in srgb, var(--ink) 6%, transparent); border:1px solid var(--rule); border-radius:980px; min-width:2rem; min-height:2rem; padding:.375rem .7rem; cursor:pointer; transition:color .18s, border-color .18s, background .18s, transform .12s cubic-bezier(.2,.7,.2,1); }
  .btn:hover { color:var(--ink); border-color:color-mix(in srgb, var(--ink) 42%, transparent); }
  .btn:active { transform:scale(.96); transition-duration:.09s; }

  #viewer { flex:1; overflow:auto; padding:clamp(16px,4vw,40px); display:flex; flex-direction:column; align-items:center; gap:14px; }
  /* flex-shrink:0 is load-bearing: #viewer is a column flexbox with a constrained height, so
     pages get compressed to fit unless told not to. Without overflow:hidden the canvas simply
     overflowed the squashed box and still looked right — with it, pages clip mid-line. */
  .page { position:relative; flex:0 0 auto; max-width:100%; border-radius:10px; overflow:hidden; box-shadow:0 20px 50px -18px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.2); animation:fade .5s ease both; }
  #viewer canvas { display:block; max-width:100%; height:auto; }
  @keyframes fade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce){ .page { animation:none; } }
  /* pdf.js annotation layer — makes in-PDF hyperlinks clickable */
  .annotationLayer { position:absolute; top:0; left:0; pointer-events:none; transform-origin:0 0; z-index:3; }
  .annotationLayer section { position:absolute; text-align:initial; pointer-events:auto; box-sizing:border-box; transform-origin:0 0; }
  .annotationLayer .linkAnnotation > a { position:absolute; font-size:1em; top:0; left:0; width:100%; height:100%; border-radius:2px; transition:background .15s, box-shadow .15s; }
  .annotationLayer .linkAnnotation > a:hover { background:color-mix(in srgb, var(--accent) 24%, transparent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent); }
  .status { color:var(--ink-soft); font-family:ui-monospace,"SF Mono","SFMono Nerd Font Mono",Menlo,monospace; font-size:.85rem; margin-top:40px; }
  .status.err { color:#e0564a; }
  /* HIG: translucency and hairlines both give way under increased contrast / reduced transparency */
  @media (prefers-reduced-transparency:reduce), (prefers-contrast:more) {
    .topbar { background:var(--bg); backdrop-filter:none; -webkit-backdrop-filter:none; border-bottom:1px solid var(--rule); }
  }
</style>

<body>

<div class="topbar">
  <a class="back" href="index.html">← <b>apatel.co</b></a>
  <div class="tabs">
    <button class="tab" type="button" data-file="resume.pdf">résumé</button>
    <button class="tab" type="button" data-file="cv.pdf">cv</button>
  </div>
  <div class="controls">
    <a class="btn" id="dlBtn" href="#" download>↓ download</a>
  </div>
</div>

<div id="viewer"><div class="status">loading…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var viewer = document.getElementById('viewer');
  var dlBtn = document.getElementById('dlBtn');
  var params = new URLSearchParams(location.search);
  // only accept a plain local *.pdf filename (no paths / URLs / javascript:)
  var requested = params.get('file');
  var current = (requested && /^[\w.-]+\.pdf$/.test(requested)) ? requested : 'resume.pdf';

  function setTabs(file){
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t.dataset.file === file); });
    document.title = (file === 'cv.pdf' ? 'cv' : 'résumé') + ' — apatel.co';
    dlBtn.href = file; dlBtn.setAttribute('download', file);
  }

  // minimal link service — core pdf.min.js doesn't ship PDFLinkService.
  // external URLs (the only kind on the résumé/CV) just need addLinkAttributes.
  var linkService = {
    externalLinkEnabled: true,
    addLinkAttributes: function(link, url){
      link.href = url; link.rel = 'noopener noreferrer nofollow'; link.target = '_blank';
    },
    getDestinationHash: function(){ return '#'; },
    getAnchorUrl: function(){ return '#'; },
    goToDestination: function(){ return Promise.resolve(); },
    executeNamedAction: function(){}, executeSetOCGState: function(){},
    eventBus: null
  };

  // cache parsed documents so switching tabs / resizing never re-downloads a PDF
  var docs = {}, currentPdf = null, lastWidth = 0, renderToken = 0;
  function getDoc(file){
    if (!docs[file]) {
      docs[file] = pdfjsLib.getDocument({ url: file, cMapUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/', cMapPacked:true }).promise
        .catch(function(e){ delete docs[file]; throw e; }); // don't cache failures — allow retry
    }
    return docs[file];
  }

  function render(pdf){
    var token = ++renderToken;                     // stale renders (old tab / size) bail out
    var width = Math.min(viewer.clientWidth - 8, 900);
    lastWidth = width;
    var dpr = window.devicePixelRatio || 1;
    viewer.innerHTML = '';
    var chain = Promise.resolve();
    for (var i = 1; i <= pdf.numPages; i++) (function(n){
      chain = chain.then(function(){
        if (token !== renderToken) return;         // a newer render superseded this one
        return pdf.getPage(n).then(function(page){
          if (token !== renderToken) return;
          var base = page.getViewport({ scale: 1 });
          var cssScale = width / base.width;               // on-screen scale
          var cssVp = page.getViewport({ scale: cssScale });
          var renderVp = page.getViewport({ scale: cssScale * dpr }); // crisp canvas backing store

          var pageDiv = document.createElement('div');
          pageDiv.className = 'page';
          pageDiv.style.width = cssVp.width + 'px';
          pageDiv.style.height = cssVp.height + 'px';

          var canvas = document.createElement('canvas');
          canvas.width = renderVp.width; canvas.height = renderVp.height;
          canvas.style.width = cssVp.width + 'px';
          canvas.style.height = cssVp.height + 'px';
          pageDiv.appendChild(canvas);
          viewer.appendChild(pageDiv);

          return page.render({ canvasContext: canvas.getContext('2d'), viewport: renderVp }).promise
            .then(function(){ return page.getAnnotations(); })
            .then(function(annotations){
              if (token !== renderToken || !annotations || !annotations.length) return;
              var annDiv = document.createElement('div');
              annDiv.className = 'annotationLayer';
              annDiv.style.setProperty('--scale-factor', cssScale);
              pageDiv.appendChild(annDiv);
              var layer = new pdfjsLib.AnnotationLayer({
                div: annDiv, accessibilityManager: null, annotationCanvasMap: null,
                page: page, viewport: cssVp.clone({ dontFlip: true })
              });
              return layer.render({
                annotations: annotations, div: annDiv,
                linkService: linkService, renderForms: false
              });
            });
        });
      });
    })(i);
    return chain;
  }

  function load(file){
    current = file; setTabs(file);
    viewer.innerHTML = '<div class="status">loading…</div>';
    getDoc(file)
      .then(function(pdf){ if (current !== file) return; currentPdf = pdf; return render(pdf); })
      .catch(function(e){ if (current === file){ viewer.innerHTML = '<div class="status err"></div>'; viewer.firstChild.textContent = 'could not load ' + file + ' — ' + e.message; } });
  }

  document.querySelectorAll('.tab').forEach(function(t){ t.addEventListener('click', function(){ load(t.dataset.file); }); });
  // re-render on resize only when the width actually changed (ignore mobile URL-bar height jitter)
  var rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(function(){
    if (currentPdf && Math.min(viewer.clientWidth - 8, 900) !== lastWidth) render(currentPdf);
  }, 250); });
  load(current);
})();
</script>
</body>

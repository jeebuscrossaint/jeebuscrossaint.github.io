<style>
  /* A second, page-local bar under the global nav — document controls belong to the document,
     not to the site. Same material, so the two read as one stack of chrome. */
  .docbar {
    position:sticky; top:var(--nav-h); z-index:20;
    background:var(--nav);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid color-mix(in srgb, var(--rule) 55%, transparent);
  }
  .docbar-in {
    max-width:var(--maxw-wide); margin:0 auto; min-height:52px;
    padding:8px var(--gutter);
    display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center;
  }
  .docbar .title { font-size:.875rem; font-weight:600; letter-spacing:-0.01em; justify-self:start; }
  .docbar .controls { justify-self:end; }

  /* segmented control */
  .seg {
    justify-self:center; display:flex; gap:2px; padding:2px;
    border-radius:var(--r-pill);
    background:color-mix(in srgb, var(--ink) 8%, transparent);
  }
  .seg button {
    font:inherit; font-size:.8125rem; font-weight:500; letter-spacing:-0.01em;
    color:var(--ink-2); background:none; border:none; border-radius:var(--r-pill);
    min-height:1.875rem; padding:.375rem 1rem; cursor:pointer;
    transition:color .2s var(--ease), background .2s var(--ease), transform .12s var(--ease);
  }
  .seg button:hover { color:var(--ink); }
  .seg button:active { transform:scale(.97); transition-duration:.09s; }
  .seg button[aria-selected="true"] {
    color:var(--ink); font-weight:600; background:var(--card);
    box-shadow:0 1px 3px rgba(0,0,0,.16), 0 0 0 .5px rgba(0,0,0,.05);
  }
  .dl {
    font-size:.8125rem; letter-spacing:-0.01em; color:var(--link);
    display:inline-flex; align-items:center; gap:.35em; min-height:2rem; padding:.25rem .25rem;
  }
  .dl:hover { text-decoration:underline; }

  #viewer {
    flex:1; padding:clamp(20px,3.5vw,44px) var(--gutter) clamp(40px,6vw,80px);
    display:flex; flex-direction:column; align-items:center; gap:16px;
    background:var(--tint);
  }
  /* flex-shrink:0 is load-bearing: #viewer is a column flexbox, so pages get compressed to
     fit unless told not to, and overflow:hidden then clips them mid-line. */
  .page {
    position:relative; flex:0 0 auto; max-width:100%;
    border-radius:var(--r-sm); overflow:hidden;
    box-shadow:0 12px 40px -14px rgba(0,0,0,.35), 0 1px 4px rgba(0,0,0,.12);
    animation:fade .5s var(--ease) both;
  }
  #viewer canvas { display:block; max-width:100%; height:auto; }
  @keyframes fade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce){ .page { animation:none; } }

  /* pdf.js annotation layer — makes in-PDF hyperlinks clickable */
  .annotationLayer { position:absolute; top:0; left:0; pointer-events:none; transform-origin:0 0; z-index:3; }
  .annotationLayer section { position:absolute; text-align:initial; pointer-events:auto; box-sizing:border-box; transform-origin:0 0; }
  .annotationLayer .linkAnnotation > a { position:absolute; font-size:1em; top:0; left:0; width:100%; height:100%; border-radius:2px; transition:background .15s, box-shadow .15s; }
  .annotationLayer .linkAnnotation > a:hover {
    background:color-mix(in srgb, var(--fill) 20%, transparent);
    box-shadow:0 0 0 2px color-mix(in srgb, var(--fill) 50%, transparent);
  }
  .status { color:var(--ink-2); font-family:var(--font-mono); font-size:.875rem; margin-top:40px; }
  .status.err { color:#e0564a; }

  @media (prefers-reduced-transparency:reduce), (prefers-contrast:more) {
    .docbar { background:var(--page); backdrop-filter:none; -webkit-backdrop-filter:none; }
  }
</style>

<!-- vendored, not CDN -->
<script src="vendor/pdf.min.js"></script>
<script>
(function(){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
  var viewer = document.getElementById('viewer');
  var dlBtn = document.getElementById('dlBtn');
  var docTitle = document.getElementById('docTitle');
  var crumbDoc = document.getElementById('crumbDoc');
  var params = new URLSearchParams(location.search);
  // only accept a plain local *.pdf filename (no paths / URLs / javascript:)
  var requested = params.get('file');

  /* Every document the viewer knows about. `group` ties siblings together into a segmented
     control; a document with no group is shown on its own, with the tabs hidden. Anything
     not listed still opens — it just gets its filename as a title. */
  var DOCS = {
    'resume.pdf':    { label: 'Résumé', group: 'cv' },
    'cv.pdf':        { label: 'CV',     group: 'cv' },
    'ai-safety.pdf': { label: 'Paper',
                       title: 'AI detectors and countermeasures',
                       crumb: [{ href: 'research.html', text: 'Research' },
                               { href: 'chameleon.html', text: 'AI detectors' }] }
  };

  var current = (requested && /^[\w.-]+\.pdf$/.test(requested)) ? requested : 'resume.pdf';
  function meta(file){ return DOCS[file] || { label: file.replace(/\.pdf$/, '') }; }

  function setTabs(file){
    var m = meta(file);
    var seg = document.querySelector('.seg');
    var siblings = m.group
      ? Object.keys(DOCS).filter(function(k){ return DOCS[k].group === m.group; })
      : [];

    seg.innerHTML = '';
    seg.hidden = siblings.length < 2;
    siblings.forEach(function(k){
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(k === file));
      b.dataset.file = k;
      b.textContent = DOCS[k].label;
      b.addEventListener('click', function(){ load(k); });
      seg.appendChild(b);
    });

    var name = m.title || m.label;
    document.title = name + ' — apatel.co';
    docTitle.textContent = name;
    document.getElementById('docHeading').textContent = name;
    dlBtn.href = file; dlBtn.setAttribute('download', file);

    // breadcrumb: rebuild the trail this document actually sits under
    var crumb = crumbDoc.parentNode;
    crumb.innerHTML = '<a href="index.html">apatel.co</a>';
    (m.crumb || []).forEach(function(step){
      crumb.insertAdjacentHTML('beforeend',
        ' \u203a <a href="' + step.href + '">' + step.text + '</a>');
    });
    crumb.insertAdjacentHTML('beforeend', ' \u203a <span id="crumbDoc"></span>');
    crumbDoc = document.getElementById('crumbDoc');
    crumbDoc.textContent = m.label;
  }

  // minimal link service — core pdf.min.js doesn't ship PDFLinkService.
  // external URLs (the only kind on the résumé/CV) just need addLinkAttributes.
  var linkService = {
    externalLinkEnabled: true,
    addLinkAttributes: function(link, url){
      link.href = url; link.rel = 'noopener noreferrer nofollow'; link.target = '_blank';
    },
    getDestinationHash: function(){ return '#'; },
    getAnchorUrl: function(){ return '#'; },
    goToDestination: function(){ return Promise.resolve(); },
    executeNamedAction: function(){}, executeSetOCGState: function(){},
    eventBus: null
  };

  // cache parsed documents so switching tabs / resizing never re-downloads a PDF.
  // No cMapUrl: both documents are Typst output with embedded Latin fonts, and the cmaps
  // pack is ~1.3 MB of CJK tables nothing here reads.
  var docs = {}, currentPdf = null, lastWidth = 0, renderToken = 0;
  function getDoc(file){
    if (!docs[file]) {
      docs[file] = pdfjsLib.getDocument({ url: file }).promise
        .catch(function(e){ delete docs[file]; throw e; }); // don't cache failures — allow retry
    }
    return docs[file];
  }

  function render(pdf){
    var token = ++renderToken;                     // stale renders (old tab / size) bail out
    var width = Math.min(viewer.clientWidth - 8, 900);
    lastWidth = width;
    var dpr = window.devicePixelRatio || 1;
    viewer.innerHTML = '';
    var chain = Promise.resolve();
    for (var i = 1; i <= pdf.numPages; i++) (function(n){
      chain = chain.then(function(){
        if (token !== renderToken) return;         // a newer render superseded this one
        return pdf.getPage(n).then(function(page){
          if (token !== renderToken) return;
          var base = page.getViewport({ scale: 1 });
          var cssScale = width / base.width;                          // on-screen scale
          var cssVp = page.getViewport({ scale: cssScale });
          var renderVp = page.getViewport({ scale: cssScale * dpr });  // crisp canvas backing store

          var pageDiv = document.createElement('div');
          pageDiv.className = 'page';
          pageDiv.style.width = cssVp.width + 'px';
          pageDiv.style.height = cssVp.height + 'px';

          var canvas = document.createElement('canvas');
          canvas.width = renderVp.width; canvas.height = renderVp.height;
          canvas.style.width = cssVp.width + 'px';
          canvas.style.height = cssVp.height + 'px';
          pageDiv.appendChild(canvas);
          viewer.appendChild(pageDiv);

          return page.render({ canvasContext: canvas.getContext('2d'), viewport: renderVp }).promise
            .then(function(){ return page.getAnnotations(); })
            .then(function(annotations){
              if (token !== renderToken || !annotations || !annotations.length) return;
              var annDiv = document.createElement('div');
              annDiv.className = 'annotationLayer';
              annDiv.style.setProperty('--scale-factor', cssScale);
              pageDiv.appendChild(annDiv);
              var layer = new pdfjsLib.AnnotationLayer({
                div: annDiv, accessibilityManager: null, annotationCanvasMap: null,
                page: page, viewport: cssVp.clone({ dontFlip: true })
              });
              return layer.render({
                annotations: annotations, div: annDiv,
                linkService: linkService, renderForms: false
              });
            });
        });
      });
    })(i);
    return chain;
  }

  function load(file){
    current = file; setTabs(file);
    viewer.innerHTML = '<div class="status">Loading…</div>';
    getDoc(file)
      .then(function(pdf){ if (current !== file) return; currentPdf = pdf; return render(pdf); })
      .catch(function(e){
        if (current !== file) return;
        viewer.innerHTML = '<div class="status err"></div>';
        viewer.firstChild.textContent = 'Could not load ' + file + ' — ' + e.message;
      });
  }

  // re-render on resize only when the width actually changed (ignore mobile URL-bar jitter)
  var rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(function(){
    if (currentPdf && Math.min(viewer.clientWidth - 8, 900) !== lastWidth) render(currentPdf);
  }, 250); });
  load(current);
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Amarnath Patel — résumé & CV">
<title>résumé — apatel.co</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23111'/><text x='16' y='23' font-family='Helvetica,Arial' font-size='18' font-weight='bold' fill='%23fff' text-anchor='middle'>a</text></svg>">
<script src="schemes.js"></script>
<script src="theme.js"></script>
<style>
  @view-transition { navigation: auto; }
  :root { --bg:#09090B; --bg-2:#0F0F12; --ink:#EDECE8; --ink-soft:#8B8B87; --rule:rgba(255,255,255,0.13); --rule-2:rgba(255,255,255,0.06); --accent:#5B8CFF; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; transition:background-color .35s ease, color .35s ease; }
  .mono { font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  a { color:inherit; text-decoration:none; }
  ::selection { background:var(--accent); color:var(--bg); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:3px; }

  .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; min-height:54px; padding:8px clamp(16px,4vw,36px); border-bottom:1px solid var(--rule); background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(10px); }
  .back { font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-soft); font-weight:600; transition:color .18s; }
  .back:hover { color:var(--ink); } .back b { color:var(--ink); }
  .tabs { display:flex; gap:0; border:1px solid var(--rule); }
  .tab { font-size:.72rem; text-transform:uppercase; letter-spacing:.1em; font-weight:600; color:var(--ink-soft); background:none; border:none; border-right:1px solid var(--rule); padding:7px 15px; cursor:pointer; transition:color .18s, background .18s; }
  .tab:last-child { border-right:none; }
  .tab:hover { color:var(--ink); }
  .tab.active { color:var(--bg); background:var(--accent); }
  .controls { display:flex; align-items:center; gap:8px; }
  .schemetag { font-size:.64rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); }
  .schemetag b { color:var(--accent); }
  .btn { font-family:ui-monospace,Menlo,monospace; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); background:none; border:1px solid var(--rule); padding:6px 10px; cursor:pointer; transition:color .18s, border-color .18s; }
  .btn:hover { color:var(--ink); border-color:var(--ink); }

  #viewer { flex:1; overflow:auto; padding:clamp(16px,4vw,40px); display:flex; flex-direction:column; align-items:center; gap:14px; }
  #viewer canvas { max-width:100%; height:auto; box-shadow:0 1px 40px rgba(0,0,0,.5); display:block; animation:fade .5s ease both; }
  @keyframes fade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce){ #viewer canvas { animation:none; } }
  .status { color:var(--ink-soft); font-family:ui-monospace,Menlo,monospace; font-size:.85rem; margin-top:40px; }
  .status.err { color:#e0564a; }
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="index.html">← <b>apatel.co</b></a>
  <div class="tabs">
    <button class="tab" type="button" data-file="resume.pdf">résumé</button>
    <button class="tab" type="button" data-file="cv.pdf">cv</button>
  </div>
  <div class="controls">
    <span class="schemetag mono" id="schemeTag"></span>
    <a class="btn" id="dlBtn" href="#" download>↓ download</a>
    <button class="btn" id="shuffleBtn" type="button" title="new random palette">⟳</button>
  </div>
</div>

<div id="viewer"><div class="status">loading…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var viewer = document.getElementById('viewer');
  var dlBtn = document.getElementById('dlBtn');
  var params = new URLSearchParams(location.search);
  var current = params.get('file') || 'resume.pdf';

  function setTabs(file){
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t.dataset.file === file); });
    document.title = (file === 'cv.pdf' ? 'cv' : 'résumé') + ' — apatel.co';
    dlBtn.href = file; dlBtn.setAttribute('download', file);
  }

  function load(file){
    current = file; setTabs(file);
    viewer.innerHTML = '<div class="status">loading…</div>';
    pdfjsLib.getDocument({ url: file, cMapUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/', cMapPacked:true }).promise
      .then(function(pdf){
        viewer.innerHTML = '';
        var width = Math.min(viewer.clientWidth - 8, 900);
        var chain = Promise.resolve();
        for (var i = 1; i <= pdf.numPages; i++) (function(n){
          chain = chain.then(function(){ return pdf.getPage(n); }).then(function(page){
            var vp = page.getViewport({ scale: 1 });
            var scale = (width / vp.width) * (window.devicePixelRatio || 1);
            var v = page.getViewport({ scale: scale });
            var canvas = document.createElement('canvas');
            canvas.width = v.width; canvas.height = v.height;
            canvas.style.width = (v.width / (window.devicePixelRatio || 1)) + 'px';
            viewer.appendChild(canvas);
            return page.render({ canvasContext: canvas.getContext('2d'), viewport: v }).promise;
          });
        })(i);
        return chain;
      })
      .catch(function(e){ viewer.innerHTML = '<div class="status err">could not load ' + file + ' — ' + e.message + '</div>'; });
  }

  document.querySelectorAll('.tab').forEach(function(t){ t.addEventListener('click', function(){ load(t.dataset.file); }); });
  var rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(function(){ load(current); }, 250); });
  load(current);
})();
</script>
</body>
</html>

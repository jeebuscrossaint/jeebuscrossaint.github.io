<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Writing by Amarnath Patel">
<title>writing — apatel.co</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23111'/><text x='16' y='23' font-family='Helvetica,Arial' font-size='18' font-weight='bold' fill='%23fff' text-anchor='middle'>a</text></svg>">
<script src="schemes.js"></script>
<script src="theme.js"></script>
<style>
  :root { --bg:#09090B; --bg-2:#0F0F12; --ink:#EDECE8; --ink-soft:#8B8B87; --rule:rgba(255,255,255,0.13); --rule-2:rgba(255,255,255,0.06); --accent:#5B8CFF; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-size:17px; line-height:1.6; letter-spacing:-0.006em; -webkit-font-smoothing:antialiased; transition:background-color .35s ease, color .35s ease; }
  .mono { font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  a { color:inherit; text-decoration:none; }
  ::selection { background:var(--accent); color:var(--bg); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:3px; }

  .topbar { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; gap:12px; height:54px; padding:0 clamp(20px,5vw,44px); border-bottom:1px solid var(--rule); background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(10px); }
  .topbar .back { font-size:.78rem; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-soft); font-weight:600; transition:color .18s; }
  .topbar .back:hover { color:var(--ink); }
  .topbar .back b { color:var(--ink); }
  .controls { display:flex; align-items:center; gap:8px; }
  .schemetag { font-size:.64rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); }
  .schemetag b { color:var(--accent); }
  .btn { font-family:ui-monospace,Menlo,monospace; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); background:none; border:1px solid var(--rule); padding:6px 10px; cursor:pointer; transition:color .18s, border-color .18s; }
  .btn:hover { color:var(--ink); border-color:var(--ink); }

  main { max-width:720px; margin:0 auto; padding:clamp(36px,6vw,72px) clamp(20px,5vw,44px) 100px; }

  /* post index */
  .idx-title { font-size:.74rem; text-transform:uppercase; letter-spacing:.16em; color:var(--ink-soft); margin:0 0 24px; }
  .entry { display:block; padding:20px 0; border-top:1px solid var(--rule-2); transition:padding-left .18s; }
  .entry:hover { padding-left:8px; }
  .entry .date { font-size:.74rem; letter-spacing:.05em; color:var(--ink-soft); }
  .entry .t { font-size:1.35rem; font-weight:700; letter-spacing:-0.02em; margin:4px 0 3px; }
  .entry .d { font-size:.95rem; color:var(--ink-soft); }
  .entry .t .ar { color:var(--accent); }

  /* rendered markdown */
  #post-content h1 { font-size:clamp(1.9rem,5vw,3rem); font-weight:800; letter-spacing:-0.03em; line-height:1.05; margin:0 0 .5em; text-wrap:balance; }
  #post-content h2 { font-size:1.5rem; font-weight:700; letter-spacing:-0.02em; margin:1.9em 0 .5em; padding-bottom:.25em; border-bottom:1px solid var(--rule); }
  #post-content h3 { font-size:1.2rem; font-weight:700; letter-spacing:-0.01em; margin:1.6em 0 .4em; }
  #post-content p { margin:0 0 1.05em; }
  #post-content a { color:var(--accent); border-bottom:1px solid color-mix(in srgb, var(--accent) 45%, transparent); transition:border-color .18s; }
  #post-content a:hover { border-bottom-color:var(--accent); }
  #post-content strong { font-weight:700; }
  #post-content code { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.86em; background:var(--bg-2); border:1px solid var(--rule); padding:1px 6px; border-radius:0; }
  #post-content pre { margin:1.3em 0; background:var(--bg-2); border:1px solid var(--rule); overflow-x:auto; }
  #post-content pre code { display:block; padding:16px 18px; background:none; border:none; font-size:.85em; line-height:1.6; color:var(--ink); }
  #post-content blockquote { margin:1.3em 0; padding:.5em 1em; border-left:2px solid var(--accent); color:var(--ink-soft); }
  #post-content ul, #post-content ol { margin:0 0 1.05em 1.3em; }
  #post-content li { margin-bottom:.35em; }
  #post-content hr { border:none; border-top:1px solid var(--rule); margin:2em 0; }
  #post-content img { max-width:100%; height:auto; border:1px solid var(--rule); margin:1.3em 0; display:block; }
  #post-content table { width:100%; border-collapse:collapse; margin:1.3em 0; font-size:.9em; }
  #post-content th { text-align:left; padding:.5em .6em; border-bottom:1px solid var(--rule); color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; font-size:.72rem; }
  #post-content td { padding:.5em .6em; border-bottom:1px solid var(--rule-2); color:var(--ink-soft); }
  .loading { color:var(--ink-soft); font-family:ui-monospace,Menlo,monospace; font-size:.9rem; }
  .load-err { color:#e0564a; }
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="index.html">← <b>apatel.co</b> / writing</a>
  <div class="controls">
    <span class="schemetag mono" id="schemeTag"></span>
    <button class="btn" id="shuffleBtn" type="button" title="new random palette">⟳</button>
  </div>
</div>

<main>
  <div id="post-content"><p class="loading">loading…</p></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function(){
  var post = new URLSearchParams(location.search).get('post');
  var area = document.getElementById('post-content');

  if (!post) {
    document.title = 'writing — apatel.co';
    area.innerHTML =
      '<p class="idx-title">Writing</p>' +
      '<a class="entry" href="post.html?post=c-cpp-nixos-clangd-guide"><span class="date mono">2026 · 03 · 15</span><div class="t">Getting clangd to work on NixOS <span class="ar">→</span></div><div class="d">Fixing the “vector file not found” and iostream errors once and for all.</div></a>' +
      '<a class="entry" href="post.html?post=a-better-tree-for-win"><span class="date mono">2026 · 01 · 20</span><div class="t">The built-in Windows tree command is trash <span class="ar">→</span></div><div class="d">And here’s how to replace it with something actually good.</div></a>';
    return;
  }
  if (location.protocol === 'file:') {
    area.innerHTML = '<p class="loading load-err">posts need a web server — open via <a href="https://apatel.co">apatel.co</a>.</p>';
    return;
  }
  fetch('posts/' + post + '.md')
    .then(function(r){ if(!r.ok) throw new Error('post not found: ' + post); return r.text(); })
    .then(function(md){
      area.innerHTML = marked.parse(md);
      var h1 = area.querySelector('h1');
      if (h1) document.title = h1.textContent + ' — apatel.co';
    })
    .catch(function(err){ area.innerHTML = '<p class="loading load-err">error: ' + err.message + '</p>'; });
})();
</script>
</body>
</html>

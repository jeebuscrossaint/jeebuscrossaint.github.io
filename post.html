<!-- vendored, not CDN: GitHub Pages serves whatever is committed, so there is no reason to
     hand a third party the request log for every reader. -->
<script src="vendor/marked.min.js"></script>
<script>
(function(){
  var post = new URLSearchParams(location.search).get('post');
  // slugs are a closed set of filenames — anything else is refused rather than fetched,
  // so a crafted ?post=../… can't pull an unrelated file into the page
  if (post !== null && !/^[a-z0-9][a-z0-9-]*$/i.test(post)) post = '';
  var area = document.getElementById('post-content');
  function setCanonical(href){ var l=document.querySelector('link[rel=canonical]'); if(l) l.href=href; }

  // NOTE: index.html lists the two latest of these in static markup — keep in sync.
  var POSTS = [
    { slug:'c-cpp-nixos-clangd-guide', date:'2026 · 03 · 15',
      title:'Getting clangd to work on NixOS',
      blurb:'Fixing the “vector file not found” and iostream errors once and for all.' },
    { slug:'a-better-tree-for-win', date:'2026 · 01 · 20',
      title:'The built-in Windows tree command is trash',
      blurb:'And here’s how to replace it with something actually good.' }
  ];

  function esc(s){ return s.replace(/[&<>"]/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }

  if (!post) {
    document.title = 'Writing — apatel.co';
    var html =
      '<div class="stack">' +
        '<h1 class="t-section reveal">Writing.</h1>' +
        '<p class="t-intro dim reveal d1" style="max-width:44ch">Notes on the things that took me ' +
        'too long to figure out the first time.</p>' +
        '<div class="rows reveal d2" style="margin-top:2rem">';
    POSTS.forEach(function(p){
      html +=
        '<a class="row" href="post.html?post=' + encodeURIComponent(p.slug) + '">' +
          '<span>' +
            '<span class="t-small mono" style="display:block;margin-bottom:4px">' + esc(p.date) + '</span>' +
            '<span class="k">' + esc(p.title) + '</span>' +
            '<span class="b" style="display:block;margin-top:5px">' + esc(p.blurb) + '</span>' +
          '</span>' +
          '<span class="chev" aria-hidden="true">›</span>' +
        '</a>';
    });
    area.innerHTML = html + '</div></div>';
    // nav.js already ran its reveal pass over the original DOM, so light up what we just built
    area.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('in'); });
    return;
  }

  if (location.protocol === 'file:') {
    area.innerHTML = '<p class="status err">Posts need a web server — open via <a href="https://apatel.co">apatel.co</a>.</p>';
    return;
  }

  fetch('posts/' + post + '.md')
    .then(function(r){ if(!r.ok) throw new Error('post not found: ' + post); return r.text(); })
    .then(function(md){
      area.className = 'article';
      area.innerHTML = marked.parse(md);
      var h1 = area.querySelector('h1');
      if (h1) document.title = h1.textContent + ' — apatel.co';
      setCanonical('https://apatel.co/post.html?post=' + encodeURIComponent(post));
      var back = document.createElement('p');
      back.style.marginTop = '3rem';
      back.innerHTML = '<a class="cta" href="post.html">All writing</a>';
      area.appendChild(back);
    })
    .catch(function(err){
      area.innerHTML = '<p class="status err"></p>';
      area.firstChild.textContent = 'Error: ' + err.message;
    });
})();
</script>

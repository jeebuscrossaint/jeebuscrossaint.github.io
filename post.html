<style>
  @view-transition { navigation: auto; }
  /* Inter stands in for SF on non-Apple platforms. Apple devices resolve -apple-system first and
     never download this file — browsers only fetch a webfont whose glyphs actually get used. */
  @font-face {
    font-family:'InterVar';
    src:url('fonts/inter-var-latin.woff2') format('woff2-variations');
    font-weight:100 900; font-style:normal; font-display:swap;
  }

  /* Apple's system palette — one considered scheme that follows the OS appearance
     instead of a random pick. These are Apple's published system colours:
     systemGroupedBackground / secondarySystemBackground, label / secondaryLabel,
     separator, and systemBlue in its light and dark variants. */
  :root {
    color-scheme: light dark;
    --bg:#F2F2F7; --bg-2:#FFFFFF; --surface:#FFFFFF;
    --ink:#000000; --ink-soft:#6C6C70;
    --rule:rgba(60,60,67,0.29); --rule-2:rgba(60,60,67,0.12);
    /* HIG: don't hard-code system colours — AccentColor resolves to the visitor's own OS
       accent (Graphite, Blue, whatever they set). Graphite is the fallback where the
       keyword is unsupported. Used for fills and tints only, never to carry meaning. */
    --accent:#8C8C8C;
    --accent:AccentColor;
    --edge:rgba(255,255,255,0.72); --mat:86%;
    --shadow:0 30px 60px -26px rgba(0,0,0,.26), 0 2px 8px rgba(0,0,0,.09);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      /* macOS dark, not iOS: windowBackgroundColor is a dark grey, not #000. Pure black is an
         OLED-phone value and reads as a hole on a desktop display. */
      --bg:#1C1C1E; --bg-2:#2C2C2E; --surface:#2C2C2E;
      --ink:#FFFFFF; --ink-soft:#A1A1A8;
      --rule:rgba(84,84,88,0.65); --rule-2:rgba(84,84,88,0.32);
      --accent:#98989F;
      --accent:AccentColor;
      --edge:rgba(255,255,255,0.16); --mat:70%;
      --shadow:0 34px 70px -24px rgba(0,0,0,.62), 0 3px 10px rgba(0,0,0,.22);
    }
  }
  @media (prefers-contrast: more) {
    :root {
      --ink-soft:#3C3C43;
      --rule:rgba(60,60,67,0.68); --rule-2:rgba(60,60,67,0.34);
      --mat:100%;
    }
  }
  @media (prefers-contrast: more) and (prefers-color-scheme: dark) {
    :root {
      --ink-soft:#EBEBF5;
      --rule:rgba(235,235,245,0.60); --rule-2:rgba(235,235,245,0.30);
      --mat:100%;
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SFProText Nerd Font","SF Pro",InterVar,"Helvetica Neue",Helvetica,Arial,sans-serif; font-size:17px; line-height:1.6; letter-spacing:-0.006em; -webkit-font-smoothing:antialiased; transition:background-color .35s ease, color .35s ease; }
  .mono { font-family:ui-monospace,"SF Mono","SFMono Nerd Font Mono",Menlo,Consolas,monospace; }
  a { color:inherit; text-decoration:none; }
  ::selection { background:color-mix(in srgb, var(--ink) 22%, transparent); color:var(--ink); }
  :focus-visible { outline:2px solid var(--ink); outline-offset:3px; }

  .topbar { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; gap:12px; height:54px; padding:0 clamp(20px,5vw,44px); border-bottom:1px solid var(--rule-2); background:color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%); }
  .topbar .back { font-size:.9rem; letter-spacing:-0.006em; color:var(--ink-soft); font-weight:400; transition:color .18s; }
  .topbar .back:hover { color:var(--ink); }
  .topbar .back b { color:var(--ink); }

  main { max-width:720px; margin:0 auto; padding:clamp(36px,6vw,72px) clamp(20px,5vw,44px) 100px; }

  /* post index */
  .idx-title { font-size:.9rem; letter-spacing:-0.006em; color:var(--ink-soft); margin:0 0 1.5rem; }
  .entry { display:block; padding:1.25rem 1rem; margin:0 -1rem; border-radius:16px; border-top:1px solid var(--rule-2);
    transition:background .18s ease, transform .18s cubic-bezier(.2,.7,.2,1); }
  .entry:hover { background:color-mix(in srgb, var(--accent) 8%, transparent); transform:translateX(5px); }
  .entry:active { transform:translateX(5px) scale(.995); transition-duration:.1s; }
  .entry .date { font-size:.82rem; letter-spacing:-0.004em; color:var(--ink-soft); }
  .entry .t { font-size:1.35rem; font-weight:700; letter-spacing:-0.02em; margin:4px 0 3px; }
  .entry .d { font-size:.95rem; color:var(--ink-soft); }
  .entry .t .ar { color:var(--ink-soft); display:inline-block; transition:transform .18s ease; }
  .entry:hover .t .ar { transform:translate(3px,0); }

  /* rendered markdown */
  #post-content h1 { font-size:clamp(1.9rem,5vw,3rem); font-weight:800; letter-spacing:-0.03em; line-height:1.05; margin:0 0 .5em; text-wrap:balance; }
  #post-content h2 { font-size:1.5rem; font-weight:700; letter-spacing:-0.02em; margin:1.9em 0 .5em; padding-bottom:.25em; border-bottom:1px solid var(--rule); }
  #post-content h3 { font-size:1.2rem; font-weight:700; letter-spacing:-0.01em; margin:1.6em 0 .4em; }
  #post-content p { margin:0 0 1.05em; }
  #post-content a { color:var(--ink); border-bottom:1px solid color-mix(in srgb, var(--ink) 42%, transparent); transition:border-color .18s; }
  #post-content a:hover { border-bottom-color:var(--ink); }
  #post-content strong { font-weight:700; }
  #post-content code { font-family:ui-monospace,"SF Mono","SFMono Nerd Font Mono",Menlo,Consolas,monospace; font-size:.86em; background:var(--bg-2); border:1px solid var(--rule); padding:1px 6px; border-radius:6px; }
  #post-content pre { margin:1.3em 0; background:var(--bg-2); border:1px solid var(--rule); border-radius:14px; overflow-x:auto; }
  #post-content pre code { display:block; padding:16px 18px; background:none; border:none; font-size:.85em; line-height:1.6; color:var(--ink); }
  #post-content blockquote { margin:1.3em 0; padding:.5em 1em; border-left:2px solid var(--rule); color:var(--ink-soft); }
  #post-content ul, #post-content ol { margin:0 0 1.05em 1.3em; }
  #post-content li { margin-bottom:.35em; }
  #post-content hr { border:none; border-top:1px solid var(--rule); margin:2em 0; }
  #post-content img { max-width:100%; height:auto; border:1px solid var(--rule); border-radius:14px; margin:1.3em 0; display:block; }
  #post-content table { width:100%; border-collapse:collapse; margin:1.3em 0; font-size:.9em; }
  #post-content th { text-align:left; padding:.5em .6em; border-bottom:1px solid var(--rule); color:var(--ink-soft); font-weight:600; font-size:.85rem; }
  #post-content td { padding:.5em .6em; border-bottom:1px solid var(--rule-2); color:var(--ink-soft); }
  .loading { color:var(--ink-soft); font-family:ui-monospace,"SF Mono","SFMono Nerd Font Mono",Menlo,monospace; font-size:.9rem; }
  .load-err { color:#e0564a; }

  /* entrance reveal */
  @keyframes rise { from { opacity:0; transform:translateY(11px); } to { opacity:1; transform:none; } }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  .idx .idx-title, .idx .entry { opacity:0; animation:rise .6s cubic-bezier(.2,.7,.2,1) both; }
  .idx .idx-title { animation-delay:.02s; }
  .idx .entry:nth-child(2){animation-delay:.10s} .idx .entry:nth-child(3){animation-delay:.16s}
  .idx .entry:nth-child(4){animation-delay:.22s} .idx .entry:nth-child(n+5){animation-delay:.28s}
  .rdr { animation:fade .7s ease both; }
  @media (prefers-reduced-motion:reduce){ .idx .idx-title, .idx .entry, .rdr { animation:none; opacity:1; } }
  /* HIG: translucency and hairlines both give way under increased contrast / reduced transparency */
  @media (prefers-reduced-transparency:reduce), (prefers-contrast:more) {
    .topbar { background:var(--bg); backdrop-filter:none; -webkit-backdrop-filter:none; border-bottom:1px solid var(--rule); }
  }

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
(function(){
  var post = new URLSearchParams(location.search).get('post');
  var area = document.getElementById('post-content');
  function setCanonical(href){ var l=document.querySelector('link[rel=canonical]'); if(l) l.href=href; }

  if (!post) {
    document.title = 'writing — apatel.co';
    area.className = 'idx';
    area.innerHTML =
      '<p class="idx-title">Writing</p>' +
      '<a class="entry" href="post.html?post=c-cpp-nixos-clangd-guide"><span class="date mono">2026 · 03 · 15</span><div class="t">Getting clangd to work on NixOS <span class="ar">→</span></div><div class="d">Fixing the “vector file not found” and iostream errors once and for all.</div></a>' +
      '<a class="entry" href="post.html?post=a-better-tree-for-win"><span class="date mono">2026 · 01 · 20</span><div class="t">The built-in Windows tree command is trash <span class="ar">→</span></div><div class="d">And here’s how to replace it with something actually good.</div></a>';
    return;
  }
  if (location.protocol === 'file:') {
    area.innerHTML = '<p class="loading load-err">posts need a web server — open via <a href="https://apatel.co">apatel.co</a>.</p>';
    return;
  }
  fetch('posts/' + post + '.md')
    .then(function(r){ if(!r.ok) throw new Error('post not found: ' + post); return r.text(); })
    .then(function(md){
      area.innerHTML = marked.parse(md);
      area.classList.add('rdr');
      var h1 = area.querySelector('h1');
      if (h1) document.title = h1.textContent + ' — apatel.co';
      setCanonical('https://apatel.co/post.html?post=' + encodeURIComponent(post));
    })
    .catch(function(err){ area.innerHTML = '<p class="loading load-err"></p>'; area.firstChild.textContent = 'error: ' + err.message; });
})();
</script>
